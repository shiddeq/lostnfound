# The full app needs Node.js (API + SQLite + uploads). This workflow publishes a
# static snapshot of the front-end to GitHub Pages so the UI is viewable online.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create preview page
        run: |
          mkdir -p site
          echo '<div style="font-family:sans-serif;max-width:700px;margin:60px auto;padding:0 20px">
            <h1>🎒 Lost &amp; Found</h1>
            <p>This is a front-end preview. The full app (image uploads, chat, item data)
            requires the Node.js backend — see the README to run it locally with
            <code>npm install &amp;&amp; npm start</code>.</p>
          </div>' > site/index.html
          cp -r public/uploads site/uploads
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
