<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lost & Found</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f2f5f7; color: #1d2b36; }
  header { background: #10467a; color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 1.3rem; }
  header .spacer { flex: 1; }
  .btn { border: 0; border-radius: 8px; padding: 9px 16px; font-size: 0.95rem; cursor: pointer; font-weight: 600; }
  .btn-primary { background: #ffb100; color: #26210f; }
  .btn-primary:hover { background: #ffc23a; }
  .btn-secondary { background: #e4eaf0; color: #1d2b36; }
  .btn-danger { background: #d64545; color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  .container { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid #cfd8e0; border-radius: 8px; font-size: .95rem; }
  .tabs { display: flex; gap: 6px; background: #e4eaf0; padding: 4px; border-radius: 10px; }
  .tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: #45566a; }
  .tabs button.active { background: #fff; color: #10467a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(20,40,60,.08); cursor: pointer; transition: transform .12s; display: flex; flex-direction: column; }
  .card:hover { transform: translateY(-2px); }
  .card .thumb { height: 160px; background: #dde5ec; display: flex; align-items: center; justify-content: center; font-size: 2rem; overflow: hidden; }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .card .body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .title { font-weight: 700; font-size: 1rem; }
  .card .meta { color: #5b6b7c; font-size: .82rem; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; text-transform: uppercase; align-self: flex-start; }
  .badge.lost { background: #ffe3e3; color: #b02a2a; }
  .badge.found { background: #dcf5e3; color: #1c7a3d; }
  .empty { text-align: center; color: #5b6b7c; padding: 50px 0; }
  /* modal */
  .overlay { position: fixed; inset: 0; background: rgba(10,20,30,.55); display: none; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 14px; max-width: 820px; width: 100%; padding: 24px; }
  .modal h2 { margin-bottom: 4px; }
  .modal .sub { color: #5b6b7c; font-size: .9rem; margin-bottom: 14px; }
  .detail { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .detail .img { background: #dde5ec; border-radius: 10px; height: 300px; display: flex; align-items: center; justify-content: center; font-size: 3rem; overflow: hidden; }
  .detail .img img { width: 100%; height: 100%; object-fit: cover; }
  .detail .info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: .93rem; }
  .detail dt { color: #5b6b7c; font-weight: 600; }
  .detail dd { word-break: break-word; }
  .chatbox { grid-column: 1 / -1; border-top: 1px solid #e4eaf0; padding-top: 16px; }
  .messages { max-height: 280px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .msg { background: #eef3f8; border-radius: 10px; padding: 8px 12px; max-width: 85%; }
  .msg .who { font-weight: 700; font-size: .8rem; color: #10467a; }
  .msg .when { color: #8b98a5; font-size: .72rem; margin-left: 8px; }
  .msg p { margin-top: 2px; font-size: .93rem; white-space: pre-wrap; }
  .chat-form { display: flex; flex-direction: column; gap: 8px; }
  .chat-form .row { display: flex; gap: 8px; }
  .chat-form input[type=text], .chat-form textarea { padding: 9px 11px; border: 1px solid #cfd8e0; border-radius: 8px; font-size: .93rem; font-family: inherit; width: 100%; }
  .chat-form textarea { resize: vertical; min-height: 60px; }
  /* form modal */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1 / -1; }
  label { font-size: .85rem; font-weight: 600; color: #45566a; display: block; margin-bottom: 4px; }
  .form-grid input, .form-grid select, .form-grid textarea { padding: 9px 11px; border: 1px solid #cfd8e0; border-radius: 8px; font-size: .93rem; font-family: inherit; width: 100%; }
  .form-grid textarea { resize: vertical; min-height: 80px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; grid-column: 1 / -1; }
  .err { background: #ffe3e3; color: #b02a2a; padding: 10px 12px; border-radius: 8px; font-size: .9rem; margin-bottom: 10px; display: none; }
  .err.show { display: block; }
  .close-x { float: right; background: none; border: 0; font-size: 1.4rem; cursor: pointer; color: #5b6b7c; }
  @media (max-width: 640px) { .detail, .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>🎒 Lost &amp; Found</h1>
  <div class="spacer"></div>
  <button class="btn btn-primary" id="btnReport">+ Report an Item</button>
</header>

<div class="container">
  <div class="toolbar">
    <div class="tabs">
      <button data-tab="all" class="active">All</button>
      <button data-tab="lost">Lost</button>
      <button data-tab="found">Found</button>
    </div>
    <input type="search" id="search" placeholder="Search items, locations, categories…" />
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No items yet. Be the first to report one!</div>
</div>

<!-- Item detail modal -->
<div class="overlay" id="detailOverlay">
  <div class="modal" id="detailModal"></div>
</div>

<!-- Report form modal -->
<div class="overlay" id="formOverlay">
  <div class="modal">
    <button class="close-x" data-close="formOverlay">✕</button>
    <h2>Report an Item</h2>
    <p class="sub">Report something you lost or found. Others can contact you through the item's chat.</p>
    <div class="err" id="formErr"></div>
    <form id="reportForm">
      <div class="form-grid">
        <div>
          <label for="fType">Type *</label>
          <select id="fType" name="type" required>
            <option value="found">I found something</option>
            <option value="lost">I lost something</option>
          </select>
        </div>
        <div>
          <label for="fTitle">Title *</label>
          <input id="fTitle" name="title" maxlength="150" placeholder="e.g. Black backpack" required />
        </div>
        <div>
          <label for="fCategory">Category</label>
          <select id="fCategory" name="category">
            <option value="">—</option>
            <option>Electronics</option><option>Bags</option><option>Keys</option>
            <option>Wallet / Cards</option><option>Clothing</option><option>Jewelry</option>
            <option>Documents</option><option>Pets</option><option>Other</option>
          </select>
        </div>
        <div>
          <label for="fLocation">Location</label>
          <input id="fLocation" name="location" maxlength="150" placeholder="e.g. Main library, 2nd floor" />
        </div>
        <div>
          <label for="fDate">Date</label>
          <input id="fDate" name="date_text" maxlength="40" type="date" />
        </div>
        <div>
          <label for="fName">Your name *</label>
          <input id="fName" name="contact_name" maxlength="100" required />
        </div>
        <div>
          <label for="fEmail">Email (or phone below)</label>
          <input id="fEmail" name="contact_email" type="email" maxlength="150" />
        </div>
        <div>
          <label for="fPhone">Phone</label>
          <input id="fPhone" name="contact_phone" maxlength="40" />
        </div>
        <div class="full">
          <label for="fDesc">Description</label>
          <textarea id="fDesc" name="description" maxlength="3000" placeholder="Details that help identify the item (don't include secrets — people may ask you to confirm)"></textarea>
        </div>
        <div class="full">
          <label for="fImage">Photo (jpg / png / gif / webp, max 5 MB)</label>
          <input id="fImage" name="image" type="file" accept="image/jpeg,image/png,image/gif,image/webp" />
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" data-close="formOverlay">Cancel</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">Submit</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
let currentTab = 'all', currentQuery = '';

function openOverlay(id) { $('#' + id).classList.add('open'); }
function closeOverlay(id) { $('#' + id).classList.remove('open'); }
$$('[data-close]').forEach(b => b.addEventListener('click', () => closeOverlay(b.dataset.close)));
$$('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $$('.overlay.open').forEach(o => o.classList.remove('open')); });

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
function fmtDate(s) { return s ? s.replace('T', ' ').slice(0, 16) : ''; }

async function loadItems() {
  const params = new URLSearchParams();
  if (currentTab !== 'all') params.set('type', currentTab);
  if (currentQuery) params.set('q', currentQuery);
  const items = await fetch('/api/items?' + params).then(r => r.json());
  const grid = $('#grid');
  grid.innerHTML = items.map(it => `
    <div class="card" data-id="${it.id}">
      <div class="thumb">${it.image ? `<img src="${esc(it.image)}" alt="">` : (it.type === 'lost' ? '🔍' : '📦')}</div>
      <div class="body">
        <span class="badge ${it.type}">${it.type}</span>
        <div class="title">${esc(it.title)}</div>
        <div class="meta">${esc(it.category || 'Uncategorized')}${it.location ? ' · ' + esc(it.location) : ''}</div>
        <div class="meta">by ${esc(it.contact_name)} · ${fmtDate(it.created_at)}</div>
      </div>
    </div>`).join('');
  $$('#grid .card').forEach(c => c.addEventListener('click', () => showItem(c.dataset.id)));
  $('#empty').style.display = items.length ? 'none' : 'block';
}

$$('.tabs button').forEach(b => b.addEventListener('click', () => {
  $$('.tabs button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  currentTab = b.dataset.tab;
  loadItems();
}));
let searchTimer;
$('#search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentQuery = e.target.value.trim(); loadItems(); }, 250);
});

async function showItem(id) {
  const it = await fetch('/api/items/' + id).then(r => r.json());
  const contact = [it.contact_name, it.contact_email, it.contact_phone].filter(Boolean).map(esc).join(' · ');
  $('#detailModal').innerHTML = `
    <button class="close-x" data-close="detailOverlay">✕</button>
    <span class="badge ${it.type}">${it.type}</span>
    <h2 style="margin-top:6px">${esc(it.title)}</h2>
    <p class="sub">Posted ${fmtDate(it.created_at)}</p>
    <div class="detail">
      <div class="img">${it.image ? `<img src="${esc(it.image)}" alt="">` : (it.type === 'lost' ? '🔍' : '📦')}</div>
      <div class="info">
        <dl>
          <dt>Category</dt><dd>${esc(it.category || '—')}</dd>
          <dt>Location</dt><dd>${esc(it.location || '—')}</dd>
          <dt>Date</dt><dd>${esc(it.date_text || '—')}</dd>
          <dt>Description</dt><dd>${esc(it.description || '—')}</dd>
          <dt>Contact</dt><dd>${contact || '—'}</dd>
        </dl>
        <p style="margin-top:12px;font-size:.85rem;color:#5b6b7c">
          Tip: verify ownership before returning an item — ask the person to describe details.
        </p>
      </div>
      <div class="chatbox">
        <h3 style="margin-bottom:10px">💬 Messages &amp; contact (${it.messages.length})</h3>
        <div class="messages" id="msgs">
          ${it.messages.length ? it.messages.map(m => `
            <div class="msg">
              <span class="who">${esc(m.sender_name)}</span><span class="when">${fmtDate(m.created_at)}</span>
              <p>${esc(m.body)}</p>
            </div>`).join('') : '<p class="sub">No messages yet. Be the first to reach out!</p>'}
        </div>
        <form class="chat-form" id="chatForm" data-id="${it.id}">
          <div class="row">
            <input type="text" id="chatName" placeholder="Your name" maxlength="100" required />
          </div>
          <textarea id="chatBody" placeholder="Write a message — e.g. “I think that's mine, here are the details…”" maxlength="2000" required></textarea>
          <div class="row" style="justify-content:flex-end">
            <button class="btn btn-primary" type="submit">Send message</button>
          </div>
        </form>
      </div>
    </div>`;
  $('[data-close]', $('#detailModal')).addEventListener('click', () => closeOverlay('detailOverlay'));
  $('#chatForm').addEventListener('submit', async e => {
    e.preventDefault();
    const body = { sender_name: $('#chatName').value, body: $('#chatBody').value };
    const res = await fetch(`/api/items/${it.id}/messages`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    if (res.ok) { closeOverlay('detailOverlay'); showItem(it.id); }
  });
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
  openOverlay('detailOverlay');
}

$('#btnReport').addEventListener('click', () => { $('#reportForm').reset(); $('#formErr').classList.remove('show'); openOverlay('formOverlay'); });

$('#reportForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#submitBtn');
  btn.disabled = true;
  const res = await fetch('/api/items', { method: 'POST', body: new FormData($('#reportForm')) });
  btn.disabled = false;
  if (res.ok) { closeOverlay('formOverlay'); loadItems(); return; }
  const err = await res.json().catch(() => ({ error: 'Something went wrong' }));
  const box = $('#formErr');
  box.textContent = err.error || 'Something went wrong';
  box.classList.add('show');
});

loadItems();
</script>
</body>
</html>
